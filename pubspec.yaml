name: alea_flow
description: >
  The Flutter pipeline tool from the ALEA (AI-Led Engineering Assistant)
  suite. A Dart package that drives any Flutter project from a ticket to a
  merge request through a deterministic, config-driven pipeline.
  State-manager agnostic (Riverpod / Bloc / GetX / Provider …),
  ticket-source agnostic (Asana / Jira / Linear / file …), design-source
  agnostic (Figma / image / markup …).
version: 0.1.1
# TODO before first pub.dev publish:
#   1. Replace GuzCabQ below with your real handle.
#   2. Remove `publish_to: none` (it currently blocks `dart pub publish`).
publish_to: none
homepage: https://github.com/GuzCabQ/alea-flow
repository: https://github.com/GuzCabQ/alea-flow
issue_tracker: https://github.com/GuzCabQ/alea-flow/issues
documentation: https://github.com/GuzCabQ/alea-flow#readme

executables:
  aflow:

environment:
  sdk: ^3.12.0

dependencies:
  # Pinned to 12.x while Flutter's `flutter_test` keeps pinning
  # `test_api: 0.7.11`. analyzer 13 forces test 1.31.1+ → test_api 0.7.12,
  # which is incompatible with the current Flutter SDK pin. Bump to ^13.0.0
  # once Flutter releases a `flutter_test` that allows test_api 0.7.12.
  # alea_flow uses only stable AST + visitor APIs that work on 12.x.
  analyzer: ^12.0.0
  args: ^2.7.0
  crypto: ^3.0.7
  dart_source_graph: ^0.1.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
